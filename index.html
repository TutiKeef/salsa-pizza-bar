<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salsa">
<meta name="theme-color" content="#0f0d0b">
<title>Salsa Pizza Bar</title>

<!-- Preconnect para domínios externos -->
<!-- Firebase compat — carrega de forma bloqueante antes de qualquer coisa -->
<!-- Isso garante que firebase está definido quando o código rodar -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d0b;--s1:#1a1714;--s2:#231f1b;--s3:#2d2824;--s4:#38322c;
  --orange:#ff6c1a;--red:#ff2b4a;--amber:#ffb800;--cream:#f0e8db;
  --muted:#7a6e65;--border:#2a2420;--green:#22c55e;
  --fire:linear-gradient(135deg,#ff2b4a,#ff6c1a 55%,#ffb800);
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;
     height:100%;overflow:hidden;position:fixed;width:100%;-webkit-font-smoothing:antialiased;}

.tela{position:fixed;inset:0;overflow-y:auto;display:none;flex-direction:column;
      -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.tela.ativa{display:flex;}

/* LOADING */
#tela-loading{align-items:center;justify-content:center;}
.ll{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
    background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:24px;}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--orange);
    border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* FORMS — usados na tela entrar e nos modais */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.fg label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;}
.fg input,.fg select,.fg textarea{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--cream);font-family:'DM Sans',sans-serif;
  font-size:16px;outline:none;transition:border-color .2s;width:100%;
  -webkit-appearance:none;appearance:none;
}
.fg input:focus{border-color:var(--orange);}
.fg input::placeholder{color:var(--muted);}

.btn-p{width:100%;padding:14px;background:var(--fire);border:none;border-radius:12px;
       color:#0f0d0b;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;
       cursor:pointer;margin-top:6px;-webkit-appearance:none;}
.btn-p:active{opacity:.85;}
.btn-p:disabled{opacity:.3;cursor:not-allowed;}

/* ENTRAR */
#tela-entrar{background:var(--bg);align-items:center;justify-content:center;padding:24px;}
.card{background:var(--s1);border:1px solid var(--border);border-radius:16px;
      padding:26px 22px;width:100%;max-width:400px;margin:auto;}
.card h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px;}

.fechar-rodape{padding:16px;border-top:1px solid var(--border);flex-shrink:0;}
.btn-fechar-caixa{width:100%;padding:14px;background:transparent;
  border:1px solid var(--border);color:var(--muted);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;
  -webkit-appearance:none;}
.btn-fechar-caixa:active{border-color:var(--red);color:var(--red);}

/* APP HEADER */
#tela-app{background:var(--bg);}
.app-hd{background:var(--s1);border-bottom:1px solid var(--border);
        padding:10px 16px;padding-top:calc(10px + var(--st));
        display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.app-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;
          background:var(--fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
          background-clip:text;}
.hdr{display:flex;align-items:center;gap:7px;}
.av{width:26px;height:26px;background:var(--s3);border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--orange);}
.hn{font-size:12px;color:var(--muted);}
.btn-outro{width:100%;padding:12px;margin-top:8px;background:transparent;
  border:1px solid var(--border);border-radius:10px;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;
  -webkit-appearance:none;}

/* Indicador de rascunhos pendentes (comandas não sincronizadas) */
.pend-badge{position:fixed;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);
  background:var(--red);color:#fff;font-family:'Syne',sans-serif;font-size:11px;
  font-weight:700;padding:4px 12px;border-radius:20px;z-index:500;
  display:none;box-shadow:0 2px 8px rgba(255,43,74,.4);}
.pend-badge.show{display:block;}

/* ABAS */
/* Faixa de aviso do dia — vinda do admin, dispensável */
.aviso-banner{display:flex;align-items:center;gap:8px;
  background:#2a1500;border-bottom:1px solid var(--orange);
  padding:9px 14px;flex-shrink:0;}
.aviso-banner-icon{font-size:14px;flex-shrink:0;}
.aviso-banner-txt{flex:1;font-size:12px;color:var(--orange);font-weight:500;line-height:1.4;}
.aviso-banner-x{background:transparent;border:none;color:var(--orange);
  font-size:18px;line-height:1;padding:0 4px;cursor:pointer;flex-shrink:0;
  -webkit-appearance:none;opacity:.7;}
.aviso-banner-x:active{opacity:1;}

.abas{display:flex;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;}
.aba{flex:1;padding:11px 6px;background:transparent;border:none;color:var(--muted);
     font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
     text-transform:uppercase;letter-spacing:.8px;cursor:pointer;
     border-bottom:2px solid transparent;-webkit-appearance:none;}
.aba.on{color:var(--orange);border-bottom-color:var(--orange);}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;
     background:var(--orange);color:#0f0d0b;border-radius:8px;font-size:9px;
     font-weight:700;margin-left:4px;padding:0 3px;}

.stela{display:none;flex:1;overflow-y:auto;flex-direction:column;
       -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.stela.on{display:flex;}

/* NOVA COMANDA */
.nw-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;
       background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;}
.btn-voltar-nova{background:transparent;border:1px solid var(--border);color:var(--muted);
        font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;
        border-radius:6px;cursor:pointer;-webkit-appearance:none;}
.nw-hd-tit{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--cream);}
.nw{padding:16px;display:flex;flex-direction:column;gap:8px;
    padding-bottom:calc(130px + var(--sb));}
.sl{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:2px 0 4px;}

.bar-env{position:fixed;bottom:0;left:0;right:0;background:var(--s1);
         border-top:1px solid var(--border);
         padding:12px 16px;padding-bottom:calc(12px + var(--sb));z-index:80;}
.res{display:flex;justify-content:space-between;align-items:center;
     font-size:13px;color:var(--muted);margin-bottom:9px;}
.res strong{font-family:'Syne',sans-serif;font-size:18px;color:var(--amber);}
.btn-env{width:100%;padding:14px;background:var(--fire);border:none;
         border-radius:10px;color:#0f0d0b;font-family:'Syne',sans-serif;
         font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.btn-env:disabled{opacity:.3;cursor:not-allowed;}

/* COMANDAS */
.cw{padding:12px 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:20px;}
.cc{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cc.open{border-color:var(--orange);}
.cc-hd{padding:12px 14px;background:var(--s2);display:flex;flex-direction:column;gap:10px;}
.cc-hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.cc-inf{flex:1;min-width:0;cursor:pointer;}
.cc-cli{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.cc-dsc{font-size:11px;color:var(--amber);margin-top:2px;font-style:italic;line-height:1.3;}
.cc-met{font-size:11px;color:var(--muted);margin-top:2px;}
.cc-tot{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--amber);
        flex-shrink:0;white-space:nowrap;}

/* Botões nas pontas — Editar à esquerda, Pago à direita */
.cc-acts{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.btn-vr{background:transparent;border:1px solid var(--border);color:var(--muted);
        font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
        padding:8px 16px;border-radius:8px;cursor:pointer;-webkit-appearance:none;
        flex:1;text-align:center;}
.btn-pg{background:#0a2a14;border:1px solid var(--green);color:var(--green);
        font-family:'Syne',sans-serif;font-size:12px;font-weight:700;
        padding:8px 16px;border-radius:8px;cursor:pointer;
        white-space:nowrap;-webkit-appearance:none;flex:1;text-align:center;}

.cc-bd{display:none;padding:0 14px 12px;}
.cc.open .cc-bd{display:block;}

/* Item com preços discriminados */
.ci{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.ci:last-of-type{border-bottom:none;}
.ci-q{font-weight:700;color:var(--orange);min-width:24px;font-size:13px;padding-top:1px;}
.ci-n{flex:1;}
.ci-nm{font-size:13px;font-weight:500;}
.ci-ob{font-size:11px;color:var(--amber);font-style:italic;margin-top:2px;}
.ci-p{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;}
.ci-pu{font-size:10px;color:var(--muted);}
.ci-ps{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--amber);}
.ci-nm .tag-avulso{font-size:9px;color:var(--orange);border:1px solid var(--orange);
        border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600;
        text-transform:uppercase;letter-spacing:.5px;vertical-align:middle;}
.btn-di{background:transparent;border:none;color:var(--muted);font-size:18px;
        padding:2px 4px;cursor:pointer;flex-shrink:0;-webkit-appearance:none;}

.ci-tot{display:flex;justify-content:space-between;align-items:center;
        padding:10px 0 2px;margin-top:4px;border-top:1px solid var(--border);}
.ci-tot-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.ci-tot-v{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;}

.cc-add{width:100%;padding:9px;background:var(--s2);border:1px solid var(--border);
        border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;
        font-size:12px;cursor:pointer;margin-top:10px;text-align:center;-webkit-appearance:none;}
.cc-del{width:100%;padding:8px;background:transparent;border:1px solid var(--border);
        border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;
        font-size:11px;cursor:pointer;margin-top:6px;text-align:center;-webkit-appearance:none;}

.vz{text-align:center;padding:48px 24px;color:var(--muted);font-size:14px;line-height:1.6;}

/* FAB — botão flutuante de nova comanda na aba "Abertas" */
.fab{position:fixed;right:18px;bottom:calc(24px + var(--sb));
     width:58px;height:58px;border-radius:50%;
     background:var(--fire);border:none;color:#0f0d0b;
     font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;
     cursor:pointer;-webkit-appearance:none;z-index:70;
     box-shadow:0 4px 16px rgba(255,108,26,0.4);
     line-height:1;}
.fab:active{opacity:.85;}

/* Item avulso — botão e linha na lista do cardápio */
.cc-avulso{width:100%;padding:9px;background:transparent;border:1px dashed var(--border);
        border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;
        font-size:12px;cursor:pointer;margin-top:6px;text-align:center;-webkit-appearance:none;}
.cc-avulso:active{border-color:var(--orange);color:var(--orange);}
.av-form{display:flex;gap:8px;margin-bottom:14px;}
.av-form input[type=text]{flex:2;}
.av-form input[type=number]{flex:1;}

/* Botão ocultar comanda */
.cc-pend{width:100%;padding:9px;background:transparent;border:1px solid var(--amber);
  border-radius:8px;color:var(--amber);font-family:'DM Sans',sans-serif;
  font-size:12px;cursor:pointer;margin-top:6px;text-align:center;-webkit-appearance:none;}
.cc-pend:active{background:#2a1f00;}

/* Separador e card de comanda oculta */
.pend-sep{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--amber);padding:16px 0 6px;text-align:center;opacity:.7;}
.cc-oculta .cc-hd{background:#1a1500 !important;}
.btn-mostrar{background:transparent;border:1px solid var(--amber);color:var(--amber);
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer;-webkit-appearance:none;
  flex-shrink:0;white-space:nowrap;}

/* Controle de quantidade por item — − qty + */
.ci-qty-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.btn-dec,.btn-inc{background:transparent;border:1px solid var(--border);color:var(--orange);
  font-size:15px;width:24px;height:24px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  -webkit-appearance:none;line-height:1;}
.btn-dec:active,.btn-inc:active{background:#2a1500;}
.ci-q{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  min-width:20px;text-align:center;color:var(--cream);}

/* Tag de garçom por item (C) */
.ci-garcom{font-size:10px;color:var(--muted);margin-top:2px;font-style:normal;}

/* Barra de pesquisa comandas (B) */
.search-bar{padding:10px 16px 4px;flex-shrink:0;}
.search-input{width:100%;background:var(--s1);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;color:var(--cream);font-family:'DM Sans',sans-serif;
  font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.search-input:focus{border-color:var(--orange);}
.search-input::placeholder{color:var(--muted);}

/* Botão voltar para categorias */
.btn-voltar-cat{background:transparent;border:1px solid var(--border);color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 14px;border-radius:8px;
  cursor:pointer;-webkit-appearance:none;margin-bottom:4px;display:inline-block;}
.btn-voltar-cat:active{border-color:var(--orange);color:var(--orange);}

/* Grid de botões quadrados — cardápio (E) */
.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.cp-grid-btn{background:var(--s1);border:2px solid var(--border);border-radius:12px;
  padding:12px 6px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;cursor:pointer;-webkit-appearance:none;
  transition:all .15s;user-select:none;min-height:80px;text-align:center;}
.cp-grid-btn.sel{border-color:var(--orange);background:#2a1a0a;}
.cp-grid-btn:active{opacity:.8;}
.cp-grid-nome{font-size:12px;font-weight:600;color:var(--cream);line-height:1.2;}
.cp-grid-preco{font-size:11px;color:var(--muted);}
.cp-grid-qty{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;
  color:var(--orange);background:#2a1500;border-radius:10px;
  padding:1px 8px;margin-top:2px;}
.cp-cat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--orange);padding:8px 0 4px;grid-column:1/-1;}

.hc{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.hc-hd{padding:10px 14px;background:var(--s2);display:flex;align-items:center;
        justify-content:space-between;cursor:pointer;}
.hc-nm{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.hc-mt{font-size:11px;color:var(--muted);margin-top:2px;}
.hc-bd{display:none;padding:8px 14px 10px;flex-direction:column;gap:3px;}
.hc.open .hc-bd{display:flex;}

/* HISTÓRICO */
.hw{padding:16px;display:flex;flex-direction:column;gap:8px;}
.hc-q{font-weight:700;color:var(--orange);min-width:22px;}
.hc-ob{font-size:11px;color:var(--amber);font-style:italic;margin-top:1px;}
.btn-rb{width:100%;padding:8px;background:transparent;border:1px solid var(--amber);
        border-radius:8px;color:var(--amber);font-family:'DM Sans',sans-serif;
        font-size:11px;cursor:pointer;margin-top:10px;text-align:center;-webkit-appearance:none;}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;
       display:none;align-items:flex-end;justify-content:center;}
#modal.show{display:flex;}
.mb{background:var(--s1);border-radius:16px 16px 0 0;
    padding:22px 20px;padding-bottom:calc(28px + var(--sb));
    width:100%;max-width:500px;border-top:1px solid var(--border);
    max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.mt{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:4px;}
.ms{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.ml{background:var(--s2);border-radius:8px;padding:12px;margin-bottom:16px;
    font-size:13px;display:flex;flex-direction:column;gap:4px;
    max-height:160px;overflow-y:auto;}
.mli{display:flex;gap:8px;}
.mlq{color:var(--orange);font-weight:700;flex-shrink:0;}
.mbtns{display:flex;gap:10px;}
.bmc{flex:1;padding:13px;background:transparent;border:1px solid var(--border);
     border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;
     font-size:14px;cursor:pointer;-webkit-appearance:none;}
.bmo {flex:2;padding:13px;background:var(--fire);border:none;
      border-radius:8px;color:#0f0d0b;font-family:'Syne',sans-serif;
      font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.bmo-g{flex:2;padding:13px;background:#0d3320;border:1px solid var(--green);
       border-radius:8px;color:var(--green);font-family:'Syne',sans-serif;
       font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.bmo-r{flex:2;padding:13px;background:#2a0a0a;border:1px solid var(--red);
       border-radius:8px;color:var(--red);font-family:'Syne',sans-serif;
       font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}

/* TOAST */
#toast{position:fixed;bottom:calc(90px + var(--sb));left:50%;
       transform:translateX(-50%) translateY(10px);
       background:var(--s2);border:1px solid var(--border);
       border-left:3px solid var(--orange);padding:10px 18px;
       border-radius:8px;font-size:13px;color:var(--cream);
       white-space:nowrap;opacity:0;transition:all .2s;z-index:400;
       pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<!-- LOADING -->
<div class="tela ativa" id="tela-loading">
  <div class="ll">🍕 Salsa</div>
  <div class="sp"></div>
</div>

<!-- ENTRAR -->
<div class="tela" id="tela-entrar">
  <div class="card" style="text-align:center">
    <div style="font-size:48px;margin-bottom:12px">🍕</div>
    <h2 style="margin-bottom:4px">Salsa Pizza Bar</h2>
    <p style="color:var(--muted);margin-bottom:24px">Qual é o seu nome?</p>
    <div id="en-rapido" style="display:none">
      <button class="btn-p" id="btn-rapido" onclick="entrarSessao()">Entrar →</button>
      <button class="btn-outro" onclick="trocarNome()">Não sou eu</button>
    </div>
    <div id="en-form">
      <div class="fg" style="text-align:left">

<script>
/* ══ FIREBASE COMPAT ══════════════════════════════════════════
   Usa a versão compat do Firebase (script normal, não ES module)
   para evitar o bug do Safari que throttle downloads de módulos
   ES enquanto a página está em primeiro plano.
   A API compat é idêntica à modular, só muda como é carregada.
═══════════════════════════════════════════════════════════════ */
firebase.initializeApp({

// Persistência offline — carrega do cache local na segunda abertura
db.enablePersistence({synchronizeTabs:true}).catch(err=>{

// ══ HELPERS FIREBASE COMPAT ══════════════════════════════
// Wraps simples da API compat — sem closures complexas

function collection(db, name){ return db.collection(name); }

function doc(db, col, id){
  if(typeof col === 'string') return db.collection(col).doc(id);
  return col.doc(id); // col já é uma CollectionReference
}

function query(ref, ...constraints){
  let q = ref;
  for(const c of constraints) q = c(q);
  return q;
}

function where(f, op, v){ return q => q.where(f, op, v); }
function orderBy(f, dir){ return q => q.orderBy(f, dir||'asc'); }
function limit(n){ return q => q.limit(n); }

function serverTimestamp(){ return firebase.firestore.FieldValue.serverTimestamp(); }
function deleteField(){ return firebase.firestore.FieldValue.delete(); }

// getDocs — QuerySnapshot do compat tem .docs, .empty, .size nativamente
function getDocs(q){ return q.get(); }

// getDoc — retorna objeto com .exists() como função e .data()
async function getDoc(ref){
  const snap = await ref.get();
  // No compat, .exists é boolean. Criamos wrapper para compatibilidade.
  const existsVal = snap.exists; // copia o valor agora
  const dataVal = snap.data();   // copia os dados agora
  return {
    exists: function(){ return existsVal; },
    data:   function(){ return dataVal; },
    id:     snap.id
  };
}

function addDoc(ref, data){ return ref.add(data); }
function updateDoc(ref, data){ return ref.update(data); }
function deleteDoc(ref){ return ref.delete(); }

// onSnapshot — normaliza DocumentSnapshot vs QuerySnapshot
function onSnapshot(q, cb, errCb){
  return q.onSnapshot(function(snap){
    if(typeof snap.exists === 'boolean'){
      // DocumentSnapshot (onSnapshot em doc único)
      const existsVal = snap.exists;
      const dataVal = snap.data();
      cb({
        exists: function(){ return existsVal; },
        data:   function(){ return dataVal; },
        id:     snap.id
      });
    } else {
      // QuerySnapshot — passa direto, tem .docs nativamente
      cb(snap);
    }
  }, errCb || undefined);
}
// ═══════════════════════════════════════════════════════

/* ══ ESTADO ═══════════════════════════════════════════════
   sid  = ID da sessão no Firestore (gerado por addDoc, não é mais a data)
   nome = nome da pessoa logada
   sdoc = dados da sessão
   _cp  = cardápio em memória (atualizado em tempo real)
═══════════════════════════════════════════════════════════ */
let sid='', nome='', sdoc=null;
let unsubCmd=null, unsubCP=null, unsubSessao=null;
let sel={}, _cp=null;

/* ══ CARDÁPIO FALLBACK ════════════════════════════════════ */
const CPF=[

/* ══ CARDÁPIO EM TEMPO REAL ═══════════════════════════════
   onSnapshot na coleção 'cardapio' — quando o admin
   mudar um preço, a garçonete vê imediatamente sem recarregar
═══════════════════════════════════════════════════════════ */
function escutarCardapio(){
  if(unsubCP) unsubCP();
  unsubCP=null;
  // Usa o cardápio fallback imediatamente — garçonete pode criar comanda
  // antes mesmo do Firestore responder
  if(!_cp){ _cp=CPF; if(document.getElementById('cp-r')) renderCP(); }
  try{
    const q=query(collection(db,'cardapio'),orderBy('ordem'));
    unsubCP=onSnapshot(q,snap=>{
      _cp = snap.empty ? CPF : snap.docs.map(d=>d.data());
      if(document.getElementById('cp-r')) renderCP();
    },()=>{
      unsubCP=null;
      if(!_cp){ _cp=CPF; if(document.getElementById('cp-r')) renderCP(); }
    });
  }catch(e){
    unsubCP=null;
    if(!_cp){ _cp=CPF; if(document.getElementById('cp-r')) renderCP(); }
  }
}

/* ══ SESSÃO CANÔNICA — busca sempre a sessão aberta mais antiga ═ */
async function buscarSessaoCanonica(){
  const snap=await getDocs(query(
    collection(db,'sessoes'),
    where('status','==','aberto'),
    orderBy('abertoEm','asc'),
    limit(1)
  ));
  if(snap.empty) return null;
  return {id:snap.docs[0].id, data:snap.docs[0].data()};
}

async function init(){
  mostrar('loading');
  desligarListeners();
  sid=''; nome=''; sdoc=null; sel={};

  // Lê de localStorage E sessionStorage — o sessionStorage sobrevive
  // melhor quando o Safari está com pouca memória
  const sn=localStorage.getItem('s_nome')||sessionStorage.getItem('s_nome');
  const ss=localStorage.getItem('s_sid')||sessionStorage.getItem('s_sid');

  // CAMINHO RÁPIDO — tem nome e sessão salvos, entra direto sem esperar Firebase
  if(sn && ss){
    nome=sn; sid=ss; sdoc={abertoPor:sn,data:dHoje()};
    iniciarApp();
    validarSessaoEmBackground();
    return;
  }

  // SEM SESSÃO LOCAL — busca no Firebase
  const safetyTimer=setTimeout(()=>{
    if(document.getElementById('tela-loading')?.classList.contains('ativa')){
      renderDiaInfo({}); mostrar('entrar');
    }
  }, 5000);

  let canon=null;
  try{ canon=await buscarSessaoCanonica(); }
  catch(e){ console.warn('Erro ao buscar sessão:',e); }
  clearTimeout(safetyTimer);

  if(canon){ sdoc=canon.data; sid=canon.id; }

  // Se tem nome salvo (mesmo sem sid), preenche e entra automaticamente
  if(sn && canon){
    nome=sn; salvarLocal(sn, canon.id);
    iniciarApp();
    return;
  }

  renderDiaInfo(sdoc||{});
  if(sn) document.getElementById('en-nome').value=sn;
  mostrar('entrar');
}

/* ══ VALIDAÇÃO EM BACKGROUND ══════════════════════════════════
   Roda DEPOIS do app já estar visível. Verifica se a sessão
   salva é a canônica; se houver divergência, migra silenciosamente.
   Isso não bloqueia mais o carregamento inicial.
═══════════════════════════════════════════════════════════════ */
async function validarSessaoEmBackground(){
  // Só valida se tiver conexão — sem rede, mantém o que está
  // Erro de rede não deve expulsar a garçonete durante o turno
  try{
    const snap=await getDoc(doc(db,'sessoes',sid));
    if(snap.exists() && snap.data().status==='aberto'){
      // Sessão ainda aberta — atualiza dados locais silenciosamente
      sdoc=snap.data();
      // Verifica se existe sessão mais antiga (duplicidade)
      const canon=await buscarSessaoCanonica();
      if(canon && canon.id!==sid){
        // Migra para a canônica silenciosamente
        sid=canon.id; sdoc=canon.data;
        salvarLocal(nome,sid);
        desligarListeners();
        escutarComandas();
        escutarCardapio();
        escutarSessao();
      }
    } else if(snap.exists() && snap.data().status==='fechado'){
      // Sessão foi explicitamente fechada — aí sim avisa
      localStorage.removeItem('s_sid'); sessionStorage.removeItem('s_sid');
      toast('O turno foi encerrado.');
      setTimeout(()=>init(), 1500);
    }
    // Se não existe o documento, não faz nada — pode ser erro de rede
  }catch(e){
    // Sem rede ou erro — mantém a sessão atual sem interromper
    console.warn('Validação em background falhou (sem rede?):',e);
  }
}
window.init=init;
init();

/* ══ SAFARI / iOS — manter sessão viva ══════════════════════
   Cenário 1: pageshow com persisted=true
     O Safari restaurou a página do BFCache (navegou pra fora e voltou).
     Variáveis em memória (sid, nome) ainda estão lá — só reconectar listeners.

   Cenário 2: visibilitychange (app voltou do background)
     iOS pode ter mantido a página viva mas os listeners Firestore caíram.
     Revalidamos a sessão no Firestore antes de reconectar, porque o turno
     pode ter virado meia-noite e a sessão ainda precisa estar lá.

   Cenário 3: página foi recarregada (reload manual ou kill do Safari)
     init() roda normalmente ao carregar, busca sessão pelo localStorage.
═══════════════════════════════════════════════════════════ */
window.addEventListener('pageshow', e=>{
  if(!e.persisted) return;
  if(sid && nome){
    // BFCache restaurou a página — reconecta só os que caíram
    if(!unsubCmd) escutarComandas();
    if(!unsubCP)  escutarCardapio();
    if(!unsubSessao) escutarSessao();
  } else {
    init();
  }
});

let _visTimer=null;
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState !== 'visible') return;
  clearTimeout(_visTimer);
  _visTimer = setTimeout(async ()=>{
    if(!sid || !nome){ init(); return; }

    // Só reconecta listeners se tiverem caído — evita destruir e recriar
    // toda vez que a tela acende (causa principal da lentidão)
    if(!unsubCmd || !unsubCP || !unsubSessao){
      try{
        const snap=await getDoc(doc(db,'sessoes',sid));
        if(snap.exists() && snap.data().status==='aberto'){
          sdoc=snap.data();
          if(!unsubCmd) escutarComandas();
          if(!unsubCP)  escutarCardapio();
          if(!unsubSessao) escutarSessao();
          renderAvisoBanner(sdoc.aviso||'');
        } else {
          localStorage.removeItem('s_sid'); sessionStorage.removeItem('s_sid');
          init();
        }
      }catch(e){
        console.warn('visibilitychange offline, reconectando listeners caídos');
        if(!unsubCmd) escutarComandas();
        if(!unsubCP)  escutarCardapio();
        if(!unsubSessao) escutarSessao();
      }
    }
    // Se todos os listeners estão vivos, não faz nada — Firebase já sincroniza sozinho
  }, 400);
});

/* ══ KEEPALIVE — verificar sessão a cada 5min ════════════════
   Não recria listeners (causaria flicker). Apenas verifica se
   a sessão ainda está aberta no Firestore. Os listeners do
   onSnapshot se mantêm vivos por conta própria enquanto há
   conexão. Só recria se detectar que caíram (unsubCmd === null).
   Intervalo curto (5min) garante recuperação rápida durante
   a madrugada, quando o app fica muito tempo em background.
═══════════════════════════════════════════════════════════ */
setInterval(async ()=>{
  if(!sid || !nome) return;
  try{
    const snap=await getDoc(doc(db,'sessoes',sid));
    if(snap.exists() && snap.data().status==='aberto'){
      sdoc=snap.data();
      if(!unsubCmd) escutarComandas();
      if(!unsubCP)  escutarCardapio();
      if(!unsubSessao) escutarSessao();
      renderAvisoBanner(sdoc.aviso||'');
      reenviarRascunhosPendentes();
      fundirSessoesDuplicadas();
    } else if(snap.exists() && snap.data().status==='fechado'){
      // Sessão foi explicitamente fechada — aí sim avisa e volta
      localStorage.removeItem('s_sid'); sessionStorage.removeItem('s_sid');
      toast('O turno foi encerrado.');
      setTimeout(()=>init(), 2000);
    }
    // Se doc não existe (erro de rede), não faz nada — seguro
  }catch(e){
    // Sem rede — reconecta listeners se caíram, não expulsa ninguém
    console.warn('Keepalive: sem conexão');
    if(!unsubCmd) escutarComandas();
    if(!unsubCP)  escutarCardapio();
    if(!unsubSessao) escutarSessao();
  }
}, 5 * 60 * 1000);

/* ══ FUSÃO DE SESSÕES DUPLICADAS (consolidação de histórico) ══
   A aba "Abertas" já busca comandas globalmente (qAbertasGlobais
   em escutarComandas), então duplicidade de sessão não esconde
   comandas de ninguém. Esta função existe só para CONSOLIDAR o
   histórico/dashboard: se duas sessões abertas existirem ao
   mesmo tempo, junta tudo na mais antiga (sessaoId das comandas
   + lista de equipe) e fecha a duplicada.
   Roda em background, sem pressa — se falhar, não quebra nada.
═══════════════════════════════════════════════════════════════ */
let _fundindoSessoes=false;
async function fundirSessoesDuplicadas(){
  if(_fundindoSessoes) return;
  _fundindoSessoes=true;
  try{
    const snap=await getDocs(query(collection(db,'sessoes'), where('status','==','aberto'), orderBy('abertoEm','asc')));
    if(snap.size<=1){ _fundindoSessoes=false; return; }
    const docs=snap.docs;
    const canonicaId=docs[0].id;
    const duplicadas=docs.slice(1);
    for(const dupDoc of duplicadas){
      const dupId=dupDoc.id;
      const dupData=dupDoc.data();
      const cmdsSnap=await getDocs(query(collection(db,'comandas'), where('sessaoId','==',dupId)));
      for(const cmdDoc of cmdsSnap.docs){
        await updateDoc(doc(db,'comandas',cmdDoc.id), {sessaoId:canonicaId});
      }
      try{
        const canonSnap=await getDoc(doc(db,'sessoes',canonicaId));
        const canonData=canonSnap.data();
        const equipeUnida=[...new Set([...(canonData.equipe||[]),...(dupData.equipe||[])])];
        await updateDoc(doc(db,'sessoes',canonicaId), {equipe:equipeUnida});
      }catch(e){}
      await updateDoc(doc(db,'sessoes',dupId), {
        status:'fechado', mescladaEm: serverTimestamp(), mescladaCom: canonicaId
      });
    }
    if(sid!==canonicaId){
      const canonSnap=await getDoc(doc(db,'sessoes',canonicaId));
      sid=canonicaId; sdoc=canonSnap.data();
      salvarLocal(nome,sid);
    }
  }catch(e){
    console.error('Erro ao fundir sessões duplicadas:',e);
  }
  _fundindoSessoes=false;
}

function desligarListeners(){
  if(unsubCmd){unsubCmd();unsubCmd=null;}
  if(unsubCP){unsubCP();unsubCP=null;}
  if(unsubSessao){unsubSessao();unsubSessao=null;}
  if(_reconectarTimer){clearTimeout(_reconectarTimer);_reconectarTimer=null;}
  _recontando=false;
  _reconectarTentativas=0;
  _sessaoCache=[];
  _globaisCache=[];
}

/* ══ ENTRAR ═══════════════════════════════════════════════ */
function renderDiaInfo(s){
  // Mostra modo rápido se já tem nome salvo
  const sn=localStorage.getItem('s_nome');
  if(sn){
    document.getElementById('en-rapido').style.display='block';
    document.getElementById('en-form').style.display='none';
    document.getElementById('btn-rapido').textContent=`Entrar como ${sn} →`;
    document.getElementById('en-nome').value=sn;
  } else {
    document.getElementById('en-rapido').style.display='none';
    document.getElementById('en-form').style.display='block';
  }
}

window.trocarNome=function(){
  localStorage.removeItem('s_nome');
  document.getElementById('en-rapido').style.display='none';
  document.getElementById('en-form').style.display='block';
  document.getElementById('en-nome').value='';
  setTimeout(()=>document.getElementById('en-nome').focus(),100);
}
window.entrarSessao=async function(){
  const n=document.getElementById('en-nome').value.trim();
  if(!n){toast('Informe seu nome');return;}
  nome=n;

  if(!sid){
    // Não existe sessão — cria uma automaticamente
    try{
      const ref=await addDoc(collection(db,'sessoes'),{
        data:dHoje(), status:'aberto',
        abertoPor:n, abertoEm:serverTimestamp(), equipe:[n]
      });
      sid=ref.id; sdoc={data:dHoje(),abertoPor:n,equipe:[n]};
    }catch(e){ toast('Erro ao iniciar: '+e.message); return; }
  } else {
    // Sessão já existe — adiciona à equipe
    try{
      const eq=sdoc?.equipe||[];
      if(!eq.includes(n)){
        eq.push(n);
        await updateDoc(doc(db,'sessoes',sid),{equipe:eq});
        if(sdoc) sdoc.equipe=eq;
      }
    }catch(e){}
  }
  salvarLocal(n,sid);
  iniciarApp();
}

/* ══ INICIAR APP ══════════════════════════════════════════ */
function iniciarApp(){
  document.getElementById('app-nm').textContent=nome.split(' ')[0];
  document.getElementById('app-av').textContent=nome[0].toUpperCase();
  mostrar('app');
  // Prioridade 1: comandas e cardápio — o que a garçonete precisa ver
  escutarComandas();
  escutarCardapio();
  // Prioridade 2: aviso do dia e rascunhos — não bloqueiam nada
  setTimeout(()=>{ escutarSessao(); reenviarRascunhosPendentes(); }, 2000);
}

/* ══ AVISO DO DIA ═════════════════════════════════════════
   Escuta a sessão em tempo real para mostrar o "Aviso do dia"
   definido pelo admin. Cada pessoa pode dispensar o aviso
   individualmente (fica salvo no localStorage por sessão+texto);
   se o admin trocar o texto, o aviso volta a aparecer.
═══════════════════════════════════════════════════════════ */
function escutarSessao(){
  if(unsubSessao) unsubSessao();
  unsubSessao=null;
  if(!sid) return;
  unsubSessao=onSnapshot(doc(db,'sessoes',sid), snap=>{
    if(!snap.exists()) return;
    sdoc=snap.data();
    renderAvisoBanner(sdoc.aviso||'');
  }, err=>{ console.warn('onSnapshot sessão aviso:',err); unsubSessao=null; });
}

function renderAvisoBanner(texto){
  const banner=document.getElementById('aviso-banner');
  const txt=document.getElementById('aviso-banner-txt');
  if(!banner||!txt) return;
  if(!texto){ banner.style.display='none'; return; }
  // Verifica se essa pessoa já dispensou ESTE texto específico
  const dispensado=localStorage.getItem('s_aviso_dispensado');
  if(dispensado===texto){ banner.style.display='none'; return; }
  txt.textContent=texto;
  banner.style.display='flex';
}

document.getElementById('aviso-banner-x')?.addEventListener('click',()=>{
  const txt=document.getElementById('aviso-banner-txt').textContent;
  localStorage.setItem('s_aviso_dispensado', txt);
  document.getElementById('aviso-banner').style.display='none';
});

/* ══ RENDER CARDÁPIO — navegação por categorias (E) ═══════
   1. Tela inicial: grid de categorias (Pizzas, Bebidas, etc)
   2. Após clicar: grid de itens daquela categoria
   3. Botão "← Categorias" para voltar
═══════════════════════════════════════════════════════════ */
let _catSel=null; // índice da categoria selecionada (null = tela de categorias)

function renderCP(){
  if(!_cp)return;
  const r=document.getElementById('cp-r');
  if(!r)return;
  if(_catSel===null){
    // Tela de categorias
    r.innerHTML=`
      <div class="cp-grid">
        ${_cp.map((cat,ci)=>{
          const total=Object.entries(sel).filter(([k])=>k.startsWith(ci+'_')).reduce((a,[,s])=>a+s.qty,0);
          return `<button class="cp-grid-btn${total>0?' sel':''}" onclick="selecionarCat(${ci})">
            <span class="cp-grid-nome">${cat.categoria}</span>
            ${total>0?`<span class="cp-grid-qty">${total}×</span>`:''}
          </button>`;
        }).join('')}
      </div>`;
  } else {
    // Tela de itens da categoria selecionada
    const cat=_cp[_catSel];
    r.innerHTML=`
      <button class="btn-voltar-cat" onclick="voltarCats()">← ${cat.categoria}</button>
      <div class="cp-grid" style="margin-top:8px">
        ${cat.itens.map((it,ii)=>{
          const k=`${_catSel}_${ii}`,s=sel[k],q=s?s.qty:0;
          return `<button class="cp-grid-btn${q>0?' sel':''}" onclick="addI('${_catSel}','${ii}')">
            <span class="cp-grid-nome">${it.nome}</span>
            <span class="cp-grid-preco">R$ ${it.preco}</span>
            ${q>0?`<span class="cp-grid-qty">${q}× <span onclick="event.stopPropagation();chgI('${_catSel}','${ii}',-1)" style="margin-left:4px;opacity:.7">−</span></span>`:''}
          </button>`;
        }).join('')}
      </div>`;
  }
  atuRes();
}

window.selecionarCat=function(ci){ _catSel=ci; renderCP(); }
window.voltarCats=function(){ _catSel=null; renderCP(); }

window.addI=function(ci,ii){
  const k=`${ci}_${ii}`;
  if(!sel[k])sel[k]={qty:0,obs:''};
  sel[k].qty++;
  renderCP();
}
window.chgI=function(ci,ii,d){
  const k=`${ci}_${ii}`;if(!sel[k])return;
  sel[k].qty=Math.max(0,sel[k].qty+d);
  if(sel[k].qty===0)delete sel[k];
  renderCP();
}
window.setObs=function(ci,ii,v){const k=`${ci}_${ii}`;if(sel[k])sel[k].obs=v;}

function atuRes(){
  if(!_cp)return;
  const elIt=document.getElementById('res-it');
  const elTot=document.getElementById('res-tot');
  const elBtn=document.getElementById('btn-env');
  if(!elIt||!elTot||!elBtn)return; // elementos não estão na tela atual
  let q=0,t=0;
  for(const [k,s] of Object.entries(sel)){
    const [ci,ii]=k.split('_').map(Number);
    q+=s.qty; t+=s.qty*(_cp[ci]?.itens[ii]?.preco||0);
  }
  elIt.textContent=q===0?'Nenhum item':`${q} ${q===1?'item':'itens'}`;
  elTot.textContent=`R$ ${t}`;
  elBtn.disabled=q===0;
}

function montarItens(){
  const c=_cp||CPF;
  return Object.entries(sel).map(([k,s])=>{
    const [ci,ii]=k.split('_').map(Number);
    const cat=c[ci],it=cat.itens[ii];
    return {nome:it.nome,qty:s.qty,obs:s.obs||'',preco:it.preco,categoria:cat.tipo,garcom:nome};
  });
}

/* ══ SALVAR COMANDA COM PROTEÇÃO CONTRA PERDA ════════════════
   Se addDoc falhar (sem internet, timeout, etc):
   1. Guarda a comanda no localStorage como rascunho
   2. Tenta de novo automaticamente algumas vezes
   3. Se continuar falhando, avisa a garçonete claramente
      e MANTÉM o rascunho salvo até conseguir enviar
   Ao reconectar (visibilitychange/keepalive), tenta enviar
   rascunhos pendentes automaticamente.
═══════════════════════════════════════════════════════════ */
async function salvarComandaComRetry(comanda, cliNome, tentativa=1){
  try{
    await addDoc(collection(db,'comandas'), comanda);
    removerRascunho(comanda);
    sel={};
    const elCli=document.getElementById('inp-cli');
    const elDsc=document.getElementById('inp-dsc');
    if(elCli) elCli.value='';
    if(elDsc) elDsc.value='';
    renderCP();
    toast(`Comanda de ${cliNome} aberta!`);
    voltarAbertas();
  }catch(e){
    console.error(`Tentativa ${tentativa} falhou:`,e);
    if(tentativa===1){
      salvarRascunho(comanda);
      toast(`Sem conexão — comanda de ${cliNome} salva localmente, tentando enviar...`);
    }
    if(tentativa<=10){
      setTimeout(()=>salvarComandaComRetry(comanda, cliNome, tentativa+1), 5000);
    } else {
      // Para de tentar recursivamente — o reenviarRascunhosPendentes()
      // do keepalive (5min) vai cuidar do reenvio quando a rede voltar
      toast(`⚠ Comanda de ${cliNome} salva no celular. Será enviada automaticamente ao reconectar.`);
    }
  }
}

/* Rascunhos ficam no localStorage até serem enviados com sucesso.
   serverTimestamp() não serializa em JSON — trocamos por um
   timestamp local só para o rascunho; ao reenviar usamos
   serverTimestamp() de novo. */
function salvarRascunho(comanda){
  try{
    const rascunhos=JSON.parse(localStorage.getItem('s_rascunhos')||'[]');
    const copia={...comanda, criadaEm: undefined, _draftTime: Date.now()};
    rascunhos.push(copia);
    localStorage.setItem('s_rascunhos', JSON.stringify(rascunhos));
    atualizarBadgePendentes();
  }catch(e){ console.error('Erro ao salvar rascunho:',e); }
}
function removerRascunho(comanda){
  try{
    const rascunhos=JSON.parse(localStorage.getItem('s_rascunhos')||'[]');
    const restantes=rascunhos.filter(r=>
      !(r.cliente===comanda.cliente && r.hora===comanda.hora && r.total===comanda.total)
    );
    localStorage.setItem('s_rascunhos', JSON.stringify(restantes));
    atualizarBadgePendentes();
  }catch(e){}
}
function atualizarBadgePendentes(){
  try{
    const rascunhos=JSON.parse(localStorage.getItem('s_rascunhos')||'[]');
    const badge=document.getElementById('pend-badge');
    if(!badge) return;
    if(rascunhos.length>0){
      badge.textContent=`⚠ ${rascunhos.length} comanda(s) pendente(s) de envio`;
      badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }
  }catch(e){}
}

/* Ao iniciar o app, tenta enviar qualquer rascunho pendente
   de uma sessão anterior que não foi salvo no Firestore */
async function reenviarRascunhosPendentes(){
  try{
    const rascunhos=JSON.parse(localStorage.getItem('s_rascunhos')||'[]');
    if(!rascunhos.length){ atualizarBadgePendentes(); return; }
    atualizarBadgePendentes();
    toast(`Enviando ${rascunhos.length} comanda(s) pendente(s)...`);
    for(const r of rascunhos){
      const {_draftTime, ...comanda} = r;
      comanda.criadaEm = serverTimestamp();
      try{
        await addDoc(collection(db,'comandas'), comanda);
      }catch(e){ console.error('Falha ao reenviar rascunho:',e); return; }
    }
    localStorage.removeItem('s_rascunhos');
    atualizarBadgePendentes();
    toast('Comandas pendentes enviadas com sucesso!');
  }catch(e){ console.error('Erro ao reenviar rascunhos:',e); }
}

let _reconectarTentativas=0;
let _recontando=false;
let _reconectarTimer=null;
let _sessaoCache=[], _globaisCache=[];

function escutarComandas(){
  if(unsubCmd) unsubCmd();
  unsubCmd=null;
  if(_reconectarTimer){ clearTimeout(_reconectarTimer); _reconectarTimer=null; }
  _recontando=false;
  if(!sid) return;

  // Duas queries simples — sem 'in', sem índice composto
  const qSessao  = query(collection(db,'comandas'), where('sessaoId','==',sid));
  const qAbertas = query(collection(db,'comandas'), where('status','==','aberta'));

  const renderTudo=()=>{
    const abertas=[..._globaisCache];
    const visiveis=abertas.filter(c=>!c.oculta);
    const ocultas =abertas.filter(c=>c.oculta);
    const fechadas=_sessaoCache.filter(c=>c.status==='paga');
    renderAbertas(visiveis.sort((a,b)=>(b.criadaEm?.seconds||0)-(a.criadaEm?.seconds||0)), ocultas);
    renderHistorico(fechadas.sort((a,b)=>(b.pagaEm?.seconds||0)-(a.pagaEm?.seconds||0)));
    const bdg=document.getElementById('bdg');
    if(bdg){ bdg.textContent=visiveis.length; bdg.style.display=visiveis.length>0?'inline-flex':'none'; }
  };

  const tentarReconectar=()=>{
    if(_recontando) return;
    _recontando=true; _reconectarTentativas++;
    if(_reconectarTentativas===1) toast('Sem conexão — tentando reconectar...');
    _reconectarTimer=setTimeout(()=>{
      _reconectarTimer=null; _recontando=false;
      if(sid && nome) escutarComandas();
    }, Math.min(5000*_reconectarTentativas,30000));
  };

  const unsubS=onSnapshot(qSessao, snap=>{
    _reconectarTentativas=0; _recontando=false;
    if(_reconectarTimer){ clearTimeout(_reconectarTimer); _reconectarTimer=null; }
    _sessaoCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTudo();
  }, err=>{ console.error('onSnapshot sessão:',err); unsubCmd=null; tentarReconectar(); });

  const unsubA=onSnapshot(qAbertas, snap=>{
    _globaisCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTudo();
  }, err=>{ console.warn('onSnapshot abertas falhou'); });

  unsubCmd=()=>{ unsubS(); unsubA(); };
}

/* ══ RENDER COMANDAS ABERTAS — preços discriminados ═══════
   Header: cliente/desc/meta + total acima
   Ações: Editar (esquerda) e Pago (direita), lado a lado

let _abertasAll=[];
let _expandidas=new Set();

function renderAbertas(visiveis, ocultas){

  if(!w)return;

  const filtro=document.getElementById('search-cmd')?.value||'';
  const filtradas=filtro?visiveis.filter(c=>c.cliente.toLowerCase().includes(filtro.toLowerCase())):visiveis;

  const renderCard=(c)=>`
    <div class="cc${_expandidas.has(c.id)?' open':''}" id="cc${c.id}">
      <div class="cc-hd">
        <div class="cc-hd-top">
          <div class="cc-inf" onclick="toggleCmd('${c.id}')">
            <div class="cc-cli">${c.cliente}</div>
            ${c.descricao?`<div class="cc-dsc">📍 ${c.descricao}</div>`:''}
            <div class="cc-met">${c.garcom} · ${c.hora} · ${c.itens.length} ${c.itens.length===1?'item':'itens'}</div>
          </div>
          <span class="cc-tot">R$ ${c.total}</span>
        </div>
        <div class="cc-acts">
          <button class="btn-vr" onclick="toggleCmd('${c.id}')">✏ Editar</button>
          <button class="btn-pg" onclick="confirmarPago('${c.id}','${esc(c.cliente)}')">✓ Pago</button>
        </div>
      </div>
      <div class="cc-bd">
        ${c.itens.map((it,idx)=>`
          <div class="ci">
            <div class="ci-qty-ctrl">
              <button class="btn-dec" onclick="decrementarItem('${c.id}',${idx})">−</button>
              <span class="ci-q">${it.qty}×</span>
              <button class="btn-inc" onclick="incrementarItem('${c.id}',${idx})">+</button>
            </div>
            <div class="ci-n">
              <div class="ci-nm">${it.nome}${it.categoria==='avulso'?'<span class="tag-avulso">avulso</span>':''}</div>
              ${it.obs?`<div class="ci-ob">⚠ ${it.obs}</div>`:''}
              ${it.garcom?`<div class="ci-garcom">👤 ${it.garcom}</div>`:''}
            </div>
            <div class="ci-p">
              <span class="ci-pu">R$ ${it.preco} un.</span>
              <span class="ci-ps">R$ ${(it.qty*it.preco).toFixed(0)}</span>
            </div>
            <button class="btn-di" onclick="removerItem('${c.id}',${idx})">×</button>
          </div>`).join('')}
        <div class="ci-tot">
          <span class="ci-tot-l">Total</span>
          <span class="ci-tot-v">R$ ${c.total}</span>
        </div>
        <button class="cc-add" onclick="abrirModalAdicionar('${c.id}')">+ Adicionar itens do cardápio</button>
        <button class="cc-avulso" onclick="abrirModalAvulso('${c.id}')">+ Item avulso (nome e valor livres)</button>
        <button class="cc-pend" onclick="ocultarComanda('${c.id}')">⏳ Ocultar — cliente saiu sem pagar</button>
        <button class="cc-del" onclick="confirmarExcluir('${c.id}','${esc(c.cliente)}')">🗑 Excluir comanda</button>
      </div>
    </div>`;

  const renderCardOculto=(c)=>`
    <div class="cc cc-oculta" id="cc${c.id}">
      <div class="cc-hd" style="background:#1a1500;border-color:var(--amber)">
        <div class="cc-hd-top">
          <div class="cc-inf" onclick="toggleCmd('${c.id}')">
            <div class="cc-cli" style="opacity:.7">${c.cliente}</div>
            <div class="cc-met">${c.hora} · R$ ${c.total} · aguardando pagamento</div>
          </div>
          <button class="btn-mostrar" onclick="mostrarComanda('${c.id}')">Mostrar</button>
        </div>
      </div>

  let html='';
  if(!filtradas.length && !ocultas.length){
    html='<div class="vz">Nenhuma comanda aberta.<br>Toque no botão + para criar!</div>';
  } else {
    html+=filtradas.map(renderCard).join('');
    if(ocultas.length){
      html+=`<div class="pend-sep">⏳ Aguardando pagamento (${ocultas.length})</div>`;
      html+=ocultas.map(renderCardOculto).join('');
    }
  }
  w.innerHTML=html;
}

window.filtrarComandas=function(v){
  // Ocultas aparecem sempre, independente da pesquisa
  const ocultas=_globaisCache.filter(c=>c.oculta);
  // Visiveis: filtra pelo texto OU mostra todas se campo vazio
  const visiveis=v.trim()
    ?_abertasAll.filter(c=>c.cliente.toLowerCase().includes(v.toLowerCase()))
    :[..._abertasAll]; // cópia de todas quando campo vazio
  renderAbertas(visiveis, ocultas);
}

/* B — toggleCmd preserva estado entre renders */
window.toggleCmd=function(id){
  if(_expandidas.has(id)) _expandidas.delete(id);
  else _expandidas.add(id);
  document.getElementById('cc'+id)?.classList.toggle('open');
}

/* A — Incrementar qty */
window.incrementarItem=async function(cmdId,idx){
  _expandidas.add(cmdId); // garante que comanda permanece expandida
  await atualizarComRetry(async ()=>{
    const ref=doc(db,'comandas',cmdId);
    const snap=await getDoc(ref);
    if(!snap.exists())throw new Error('Comanda não encontrada');
    const itens=[...snap.data().itens];
    itens[idx]={...itens[idx],qty:(itens[idx].qty||1)+1};
    await updateDoc(ref,{itens,total:itens.reduce((a,i)=>a+i.qty*i.preco,0)});
  },'Item adicionado!','incrementar item');
}

/* A — Decrementar qty (remove item se chegar a 0) */
window.decrementarItem=async function(cmdId,idx){
  _expandidas.add(cmdId); // garante que comanda permanece expandida
  await atualizarComRetry(async ()=>{
    const ref=doc(db,'comandas',cmdId);
    const snap=await getDoc(ref);
    if(!snap.exists())throw new Error('Comanda não encontrada');
    const itens=[...snap.data().itens];
    let removido=false;
    if(itens[idx].qty<=1){
      itens.splice(idx,1); // remove se qty chegar a 0
      removido=true;
    } else {
      itens[idx]={...itens[idx],qty:itens[idx].qty-1};
    }
    await updateDoc(ref,{itens,total:itens.reduce((a,i)=>a+i.qty*i.preco,0)});
    return removido;
  },null,'decrementar item');
}

/* ══ REMOVER ITEM ══════════════════════════════════════════ */
window.removerItem=async function(cmdId,idx){
  _expandidas.add(cmdId); // garante que comanda permanece expandida
  await atualizarComRetry(async ()=>{
    const ref=doc(db,'comandas',cmdId);
    const snap=await getDoc(ref);
    if(!snap.exists())throw new Error('Comanda não encontrada');
    const itens=[...snap.data().itens];
    itens.splice(idx,1);
    await updateDoc(ref,{itens,total:itens.reduce((a,i)=>a+i.qty*i.preco,0)});
  }, 'Item removido', 'remover item');
}

      ${(_cp||CPF).map((cat,ci)=>{
        const total=Object.entries(_addSel).filter(([k])=>k.startsWith(ci+'_')).reduce((a,[,s])=>a+s.qty,0);
        return `<button class="cp-grid-btn${total>0?' sel':''}" onclick="addCatSel(${ci})">
          <span class="cp-grid-nome">${cat.categoria}</span>
          ${total>0?`<span class="cp-grid-qty">${total}×</span>`:''}
        </button>`;
      }).join('')}
    </div>`;
  } else {
    // Grid de itens da categoria
    const cat=(_cp||CPF)[_addCatSel];
    gridHtml=`
      <button class="btn-voltar-cat" onclick="addCatSel(null)">← ${cat.categoria}</button>
      <div class="cp-grid" style="margin-top:8px">
        ${cat.itens.map((it,ii)=>{
          const k=`${_addCatSel}_${ii}`,s=_addSel[k],q=s?s.qty:0;
          return `<button class="cp-grid-btn${q>0?' sel':''}" onclick="addMA('${_addCatSel}','${ii}')">
            <span class="cp-grid-nome">${it.nome}</span>
            <span class="cp-grid-preco">R$ ${it.preco}</span>
            ${q>0?`<span class="cp-grid-qty">${q}×</span>`:''}
          </button>`;
        }).join('')}
      </div>`;
  }

  document.getElementById('modal-box').innerHTML=`
    <div class="mt">Adicionar itens</div>
    <div class="ms">${qty>0?`${qty} itens — R$ ${tot}`:'Selecione uma categoria'}</div>
    <div style="margin-bottom:16px">${gridHtml}</div>
    <div class="mbtns">
      <button class="bmc" onclick="fecharModal()">Cancelar</button>
      <button class="bmo" onclick="confirmarAdd()" ${qty===0?'disabled style="opacity:.3"':''}>
        Adicionar${qty>0?` (${qty})`:''}
      </button>
    </div>`;
}

window.addCatSel=function(ci){ _addCatSel=ci; renderModalAdd(); }
window.addMA=function(ci,ii){const k=`${ci}_${ii}`;if(!_addSel[k])_addSel[k]={qty:0};_addSel[k].qty++;renderModalAdd();}
window.chgMA=function(ci,ii,d){const k=`${ci}_${ii}`;if(!_addSel[k])return;_addSel[k].qty=Math.max(0,_addSel[k].qty+d);if(_addSel[k].qty===0)delete _addSel[k];renderModalAdd();}

window.confirmarAdd=async function(){
  if(!_addId||!Object.keys(_addSel).length)return;
  const addIdLocal=_addId, addSelLocal={..._addSel};
  fecharModal();
  await atualizarComRetry(async ()=>{
    const ref=doc(db,'comandas',addIdLocal);
    const snap=await getDoc(ref);
    if(!snap.exists())throw new Error('Comanda não encontrada');
    const itens=[...snap.data().itens];
    for(const [k,s] of Object.entries(addSelLocal)){
      const [ci,ii]=k.split('_').map(Number);
      const cat=(_cp||CPF)[ci],it=cat.itens[ii];
      const ex=itens.find(i=>i.nome===it.nome&&!i.obs);
      if(ex) ex.qty+=s.qty;
      else itens.push({nome:it.nome,qty:s.qty,obs:'',preco:it.preco,categoria:cat.tipo,garcom:nome});
    }
    await updateDoc(ref,{itens,total:itens.reduce((a,i)=>a+i.qty*i.preco,0)});
  }, 'Itens adicionados!', 'adicionar itens');
  _addId=''; _addSel={};
}

/* ══ ITEM AVULSO — nome e valor livres ════════════════════
   Permite adicionar algo fora do cardápio fixo: promoções,
   produtos novos, substitutos de itens em falta, etc.
═══════════════════════════════════════════════════════════ */
let _avulsoId='';
window.abrirModalAvulso=function(cmdId){
  _avulsoId=cmdId;
  _expandidas.add(cmdId); // garante que permanece expandida após adicionar
  document.getElementById('modal-box').innerHTML=`
    <div class="mt">Item avulso</div>
    <div class="ms">Adicione algo fora do cardápio — nome e valor livres.</div>
    <div class="av-form">
      <input type="text" id="av-nome" placeholder="Nome do item" autocomplete="off" autocorrect="off" maxlength="60"/>
      <input type="number" id="av-preco" placeholder="R$" min="0" step="0.5" inputmode="decimal"/>
    </div>
    <div class="fg"><label>Quantidade</label>
      <input type="number" id="av-qty" value="1" min="1" max="99" inputmode="numeric"/></div>
    <div class="mbtns">
      <button class="bmc" onclick="fecharModal()">Cancelar</button>
      <button class="bmo" onclick="confirmarAvulso()">Adicionar</button>
    </div>`;
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('av-nome')?.focus(),100);

window.confirmarAvulso=async function(){
  const nomeIt=document.getElementById('av-nome').value.trim();
  const preco=parseFloat(document.getElementById('av-preco').value);
  const qty=parseInt(document.getElementById('av-qty').value)||1;
  if(!nomeIt){toast('Informe o nome do item');return;}
  if(isNaN(preco)||preco<0){toast('Informe o valor');return;}
  const cmdId=_avulsoId;
  fecharModal();
  await atualizarComRetry(async ()=>{
    const ref=doc(db,'comandas',cmdId);
    const snap=await getDoc(ref);
    if(!snap.exists())throw new Error('Comanda não encontrada');
    const itens=[...snap.data().itens];
    itens.push({nome:nomeIt,qty,obs:'',preco,categoria:'avulso',garcom:nome});
    await updateDoc(ref,{itens,total:itens.reduce((a,i)=>a+i.qty*i.preco,0)});
  }, 'Item avulso adicionado!', 'adicionar item avulso');
  _avulsoId='';
}

  );

/* ══ RETRY GENÉRICO PARA ATUALIZAÇÕES ════════════════════════
   Para operações em documentos que JÁ EXISTEM no Firestore
   (marcar pago, remover item, adicionar item, excluir, reabrir).
   Diferente de criar comanda nova: aqui o dado já está salvo,
   só a ATUALIZAÇÃO pode falhar — então um retry simples é
   suficiente, sem necessidade de rascunho local.
═══════════════════════════════════════════════════════════ */
async function atualizarComRetry(operacao, msgSucesso, descricao, tentativa=1){
  try{
    const resultado=await operacao();
    // msgSucesso pode ser string fixa ou null (caso a mensagem dependa do resultado)
    if(msgSucesso) toast(msgSucesso);
    else if(descricao==='decrementar item') toast(resultado?'Item removido':'Item atualizado!');
  }catch(e){
    console.error(`Erro ao ${descricao} (tentativa ${tentativa}):`,e);
    if(tentativa<=3){
      toast(`Tentando ${descricao} novamente...`);
      setTimeout(()=>atualizarComRetry(operacao, msgSucesso, descricao, tentativa+1), 2000);
    } else {
      toast(`⚠ Não foi possível ${descricao}. Verifique sua conexão e tente novamente.`);
    }
  }
}

        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--amber)">R$ ${c.total}</span>
          <span style="font-size:11px;color:var(--green);font-weight:600">✓ fechada</span>
        </div>
      </div>
      <div class="hc-bd">
        ${(c.itens||[]).map(it=>`
          <div class="hc-it">
            <span class="hc-q">${it.qty}×</span>
            <div style="flex:1">
              <div>${it.nome}</div>
              ${it.obs?`<div class="hc-ob">⚠ ${it.obs}</div>`:''}
              ${it.garcom?`<div style="font-size:10px;color:var(--muted);margin-top:1px">👤 ${it.garcom}</div>`:''}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0">
              <span style="font-size:10px;color:var(--muted)">R$ ${it.preco} un.</span>
              <span style="font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--amber)">R$ ${(it.qty*it.preco).toFixed(0)}</span>
            </div>
          </div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:center;

          <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Total</span>
          <span style="font-family:'Syne',sans-serif;font-size:15px;font-weight:800">R$ ${c.total}</span>
        </div>
        <button class="btn-rb" onclick="reabrirComanda('${c.id}','${esc(c.cliente)}')">↩ Reabrir comanda</button>
      </div>
    </div>`).join('');
}

function dHoje(){return new Date().toISOString().slice(0,10);}
function fmtData(d){if(!d)return'—';const[y,m,dia]=d.split('-');return`${dia}/${m}/${y}`;}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function salvarLocal(n,s){
  localStorage.setItem('s_nome',n);
  localStorage.setItem('s_sid',s);
  sessionStorage.setItem('s_nome',n); // backup — sobrevive melhor no Safari
  sessionStorage.setItem('s_sid',s);
}

let tT;
window.toast=function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3200);
}
